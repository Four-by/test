    <title>Image Thumbnail Gallery</title>
    <style>
        /* Container for the thumbnail block */
        .image-grid {
            display: grid;
            /* Creates columns that automatically adjust and fit the screen */
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Styling for the clickable links */
        .thumbnail-link {
            display: block;
            overflow: hidden;
            border-radius: 8px;
            border: 2px solid #ddd;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        /* Styling for the thumbnail images */
        .thumbnail-img {
            width: 100%;
            height: 150px;
            /* Ensures images fill the square nicely without stretching distorting */
            object-fit: cover; 
            display: block;
        }

        /* Visual effect when hovering over a thumbnail */
        .thumbnail-link:hover {
            transform: scale(1.03);
            border-color: #007BFF;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
